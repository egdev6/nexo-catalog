name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install validator
        run: python3 -m pip install --user jsonschema==4.19.2

      - name: Validate all catalogs against the schema
        run: |
          python3 - <<'PY'
          import json
          import sys
          import jsonschema

          schema = json.load(open('catalog.schema.json'))
          validator = jsonschema.Draft202012Validator(schema)
          failed = False
          for path, version in (('catalog.json', 1), ('v2/catalog.json', 2), ('v3/catalog.json', 3), ('v4/catalog.json', 4)):
              document = json.load(open(path))
              errors = list(validator.iter_errors(document))
              if document.get('schemaVersion') != version:
                  errors.append(f'expected schemaVersion {version}')
              ids = [app['id'] for app in document.get('apps', [])]
              if len(ids) != len(set(ids)):
                  errors.append('duplicate app ids')
              if version == 1 and any('detection' in app for app in document.get('apps', [])):
                  errors.append('v1 must not contain detection hints')
              if version == 3:
                  for app in document.get('apps', []):
                      if 'updaterPublicKey' in app and not app.get('installerUrl', '').endswith('_x64-setup.exe'):
                          errors.append(f"{app.get('id')}: keyed apps must point to a per-user NSIS _x64-setup.exe")
              if version == 4:
                  for app in document.get('apps', []):
                      for key, entry in app.get('platforms', {}).items():
                          if key == 'windows-x86_64' and 'updaterPublicKey' in entry and not entry.get('installerUrl', '').endswith('_x64-setup.exe'):
                              errors.append(f"{app.get('id')}: keyed windows-x86_64 entries must point to a per-user NSIS _x64-setup.exe")
              for error in errors:
                  print(f'{path}: {getattr(error, "message", error)}')
              failed = failed or bool(errors)
              print(f'{path}: {"INVALID" if errors else "valid"}')
          sys.exit(1 if failed else 0)
          PY
